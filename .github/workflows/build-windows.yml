name: Build Windows EXE and Installer

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE with PyInstaller
      run: |
        py -3 -m PyInstaller --noconsole --onefile app_gui.py --name IrrigationControlApp

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: IrrigationControlApp-exe
        path: dist/IrrigationControlApp.exe

    - name: Install Inno Setup (choco)
      run: |
        choco install innosetup -y
      shell: powershell

    - name: Build installer with Inno Setup
      run: |
        $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-Not (Test-Path $iscc)) { Write-Error "ISCC not found at $iscc"; exit 1 }
        & $iscc /DMyAppExe="$PWD\dist\IrrigationControlApp.exe" installer.iss
      shell: powershell

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: IrrigationControlInstaller
        path: ./Output/IrrigationControlInstaller.exe
